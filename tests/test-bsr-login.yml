name: Test buf setup with BSR login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.50.0'
          buf_user: testuser
          buf_api_token: testtoken
          buf_domain: buf.build
      - name: Assert buf is installed
        run: |
          which buf
          BUF_VERSION=$(buf --version 2>&1)
          echo "buf version: $BUF_VERSION"
          if ! echo "$BUF_VERSION" | grep -q "1.50.0"; then
            echo "FAIL: expected buf version 1.50.0, got: $BUF_VERSION"
            exit 1
          fi
          echo "PASS"
