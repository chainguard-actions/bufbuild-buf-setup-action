name: Test buf-setup with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-buf
        uses: .
        with:
          version: '1.50.0'
          github_token: ${{ github.token }}
      - name: Assert buf is installed and on PATH
        run: |
          echo "Checking buf is available..."
          if ! command -v buf >/dev/null 2>&1; then
            echo "FAIL: buf not found on PATH"
            exit 1
          fi
          echo "PASS: buf is available at $(command -v buf)"
      - name: Assert buf version is 1.50.0
        run: |
          VERSION="$(buf --version 2>&1)"
          echo "actual version: $VERSION"
          if [ "$VERSION" != "1.50.0" ]; then
            echo "FAIL: expected version '1.50.0' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: buf version is $VERSION"
